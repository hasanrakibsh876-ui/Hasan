<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cutting Fruits</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10182d;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;align-items:center;padding:16px}.app{width:min(100%,850px)}header{text-align:center;margin-bottom:14px}h1{margin:0;color:#8f7bff;font-size:clamp(2rem,6vw,3rem)}header p{margin:5px 0;color:#aebbd5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{background:#1d2b4d;border:1px solid #344668;border-radius:12px;padding:10px;text-align:center}.stat span{display:block;color:#aab8d4;font-size:.78rem}.stat strong{font-size:1.35rem}.game-wrap{position:relative;border:2px solid #354b70;border-radius:18px;overflow:hidden;background:#172747;box-shadow:0 16px 45px #0005}.game{display:block;width:100%;height:min(62vh,520px);min-height:300px;touch-action:none;cursor:crosshair}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0c1429c9;padding:20px;text-align:center}.overlay.hidden{display:none}.panel{max-width:420px;background:#1d2c4c;border:1px solid #50658b;border-radius:18px;padding:24px}.panel h2{margin:0 0 8px;color:#a99aff}.panel p{color:#d0d8e9;line-height:1.5}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:11px;padding:12px 24px;font-size:1rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7b5cff,#a15bff);color:white}button.secondary{background:#253758;border:1px solid #4a6087}.hint{text-align:center;color:#aab8d4;font-size:.85rem;margin:10px 0 0}@media(max-width:500px){body{padding:10px}.stats{gap:5px}.stat{padding:8px 3px}.stat strong{font-size:1.1rem}.game{min-height:340px;height:58vh}}
</style></head><body><main class="app"><header><h1>🍉 Cutting Fruits</h1><p>Swipe or drag to slice fruit. Avoid bombs!</p></header>
<div class="stats"><div class="stat"><span>SCORE</span><strong id="score">0</strong></div><div class="stat"><span>FRUITS</span><strong id="fruits">0 / 20</strong></div><div class="stat"><span>BOMBS</span><strong id="bombs">0 / 2</strong></div><div class="stat"><span>MISSED</span><strong id="missed">0 / 5</strong></div></div>
<div class="game-wrap"><canvas id="game" class="game" aria-label="Fruit cutting game"></canvas><div id="overlay" class="overlay"><div class="panel"><h2 id="messageTitle">Ready to Slice?</h2><p id="message">Cut 20 fruits to win. Each fruit gives 5 points. Avoid 2 bombs and don't miss 5 fruits.</p><button id="startBtn">Start Game</button></div></div></div><p class="hint">Controls: touch and swipe on mobile · click and drag on computer</p><div class="controls"><button class="secondary" id="restartBtn">Restart</button></div></main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const scoreEl=document.getElementById('score'),fruitEl=document.getElementById('fruits'),bombEl=document.getElementById('bombs'),missEl=document.getElementById('missed'),overlay=document.getElementById('overlay'),titleEl=document.getElementById('messageTitle'),messageEl=document.getElementById('message'),startBtn=document.getElementById('startBtn');
let W=800,H=500,items=[],particles=[],trail=[],score=0,fruitCount=0,bombs=0,missed=0,running=false,lastTime=0,spawnClock=0,elapsed=0,raf=0,swiping=false,lastPoint=null;
const fruitTypes=[['🍎','#ff5264'],['🍊','#ff9e35'],['🍉','#ff547e'],['🍋','#ffe45c'],['🥝','#85d45b'],['🍇','#b17aff'],['🍑','#ff9d9b'],['🍍','#f6ce4c']];
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=Math.max(320,r.width);H=Math.max(300,r.height);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();
function updateUI(){scoreEl.textContent=score;fruitEl.textContent=fruitCount+' / 20';bombEl.textContent=bombs+' / 2';missEl.textContent=missed+' / 5'}
function start(){cancelAnimationFrame(raf);items=[];particles=[];trail=[];score=fruitCount=bombs=missed=elapsed=spawnClock=0;running=true;swiping=false;lastTime=performance.now();updateUI();overlay.classList.add('hidden');raf=requestAnimationFrame(loop)}
function end(win,why){running=false;cancelAnimationFrame(raf);overlay.classList.remove('hidden');titleEl.textContent=win?'🎉 You Win!':'💥 Game Over';messageEl.textContent=win?'Amazing! You sliced 20 fruits and scored 100 points.':why+' Try again and beat your score!';startBtn.textContent='Play Again'}
function spawn(){const bomb=Math.random()<.22;const x=45+Math.random()*(W-90),y=H+35,r=25+Math.random()*9;const vx=(Math.random()-.5)*3.5,vy=-(8+Math.random()*3.5);items.push({x,y,r,vx,vy,gravity:.18+Math.random()*.07,bomb,emoji:bomb?'💣':fruitTypes[Math.floor(Math.random()*fruitTypes.length)][0],color:bomb?'#333':fruitTypes[Math.floor(Math.random()*fruitTypes.length)][1],cut:false})}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function down(e){if(!running)return;canvas.setPointerCapture?.(e.pointerId);swiping=true;lastPoint=point(e);trail=[lastPoint]}
function move(e){if(!running||!swiping)return;const p=point(e);trail.push(p);if(trail.length>12)trail.shift();if(lastPoint){for(const it of items){if(it.cut)continue;const d=distSeg(it.x,it.y,lastPoint,p);if(d<it.r+8)cut(it)}}lastPoint=p}
function up(){swiping=false;lastPoint=null}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('pointerleave',up);
function distSeg(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;if(!l)return Math.hypot(px-a.x,py-a.y);let t=((px-a.x)*dx+(py-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy))}
function cut(it){it.cut=true;if(it.bomb){bombs++;burst(it.x,it.y,'#ff5252');if(bombs>=2)end(false,'You cut 2 bombs.');}else{fruitCount++;score+=5;burst(it.x,it.y,it.color);if(fruitCount>=20)end(true); }updateUI()}
function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35,color})}}
function loop(now){if(!running)return;const dt=Math.min(2,(now-lastTime)/16.67||1);lastTime=now;elapsed+=dt;spawnClock+=dt;if(spawnClock>Math.max(25,55-elapsed*.025)){spawnClock=0;spawn();if(Math.random()<.35)spawn()}
for(const it of items){it.x+=it.vx*dt;it.y+=it.vy*dt;it.vy+=it.gravity*dt;if(!it.cut&&it.y-it.r>H){it.cut=true;if(!it.bomb){missed++;updateUI();if(missed>=5)end(false,'You missed 5 fruits.')}}}
items=items.filter(i=>!i.cut&&i.y<H+70);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);draw();if(running)raf=requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#20365c');g.addColorStop(1,'#101b35');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff0c';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(const it of items){ctx.save();ctx.translate(it.x,it.y);ctx.font=(it.r*2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=it.bomb?'#ff4242':'#000';ctx.shadowBlur=10;ctx.fillText(it.emoji,0,0);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(trail.length>1){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#b6faff';ctx.lineWidth=7;ctx.shadowColor='#68eaff';ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);for(const p of trail.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();ctx.shadowBlur=0}}
startBtn.addEventListener('click',start);document.getElementById('restartBtn').addEventListener('click',start);draw();
})();
</script></body></html>
